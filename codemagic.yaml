workflows:
  ios-swiftpm-build:
    name: iOS SwiftPM Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build Swift Package App
        script: |
          swift build -c release --triple arm64-apple-ios16.0
    artifacts:
      - .build/arm64-apple-ios16.0/release/*.app
      - .build/release/*.app
